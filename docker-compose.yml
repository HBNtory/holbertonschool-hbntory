services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
        - db_data:/var/lib/mysql
    restart: unless-stopped

  mcp_server:
    build:
      context: ./mcp_server
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped


  backoffice:
    build:
      context: ./backoffice
    volumes:
      - ./backoffice:/app
    ports:
      - "8080:5000"
    env_file:
      - .env
    restart: unless-stopped

  ai_service:
    build:
      context: ./ai_service
    env_file:
      - .env

volumes:
  db_data: