services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
        - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  mcp_server:
    build:
      context: ./mcp_server
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped


  backoffice:
    build:
      context: ./backoffice
    volumes:
      - ./backoffice:/app
    ports:
      - "8080:5000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: