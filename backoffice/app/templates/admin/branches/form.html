{% extends "base_admin.html" %}

{% block title %}HBntory — {% if branch %}Edit branch{% else %}New branch{% endif %}{% endblock %}

{% block content %}
<a href="/admin/branches" class="inline-block mb-4 text-xs uppercase text-cyan-700 hover:underline">&larr; back to branches</a>

<h1 class="text-2xl font-bold uppercase tracking-tight text-fuchsia-600 mb-6">
    {% if branch %}Edit branch{% else %}New branch{% endif %}
</h1>

{% if error %}
<div class="mb-5 border-l-4 border-red-500 bg-red-50 p-4">
    <p class="text-sm text-red-900">{{ error }}</p>
</div>
{% endif %}

<form method="POST" class="border-2 border-fuchsia-500 bg-white/90 p-6 shadow-[6px_6px_0px_#c026d3] max-w-lg space-y-4">
    <div>
        <label class="block text-xs uppercase text-fuchsia-600 mb-1">Label</label>
        <input type="text" name="label" required
               value="{{ branch.label if branch else '' }}"
               class="w-full border-2 border-fuchsia-300 bg-white p-2 text-sm text-fuchsia-900 focus:outline-none focus:border-cyan-500">
    </div>

    <div class="flex justify-end pt-2">
        <button type="submit"
                class="border-2 border-fuchsia-600 bg-fuchsia-400 px-6 py-2 text-sm font-bold uppercase text-white shadow-[4px_4px_0px_#a21caf] hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all">
            {% if branch %}Save{% else %}Create{% endif %}
        </button>
    </div>
</form>
{% endblock %}
