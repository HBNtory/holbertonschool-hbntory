{% extends "base_admin.html" %}

{% block title %}HBntory — {% if user %}Edit user{% else %}New user{% endif %}{% endblock %}

{% block content %}
<a href="/admin/users" class="inline-block mb-4 text-xs uppercase text-cyan-700 hover:underline">&larr; back to users</a>

<h1 class="text-2xl font-bold uppercase tracking-tight text-fuchsia-600 mb-6">
    {% if user %}Edit user{% else %}New user{% endif %}
</h1>

{% if error %}
<div class="mb-5 border-l-4 border-red-500 bg-red-50 p-4">
    <p class="text-sm text-red-900">{{ error }}</p>
</div>
{% endif %}

<form method="POST" class="border-2 border-fuchsia-500 bg-white/90 p-6 shadow-[6px_6px_0px_#c026d3] max-w-lg space-y-4">

    <div>
        <label class="block text-xs uppercase text-fuchsia-600 mb-1">First name</label>
        <input type="text" name="first_name" required
               value="{{ user.first_name if user else '' }}"
               class="w-full border-2 border-fuchsia-300 bg-white p-2 text-sm text-fuchsia-900 focus:outline-none focus:border-cyan-500">
    </div>

    <div>
        <label class="block text-xs uppercase text-fuchsia-600 mb-1">Last name</label>
        <input type="text" name="last_name" required
               value="{{ user.last_name if user else '' }}"
               class="w-full border-2 border-fuchsia-300 bg-white p-2 text-sm text-fuchsia-900 focus:outline-none focus:border-cyan-500">
    </div>

    <div>
        <label class="block text-xs uppercase text-fuchsia-600 mb-1">Email</label>
        <input type="email" name="email" required
               value="{{ user.email if user else '' }}"
               class="w-full border-2 border-fuchsia-300 bg-white p-2 text-sm text-fuchsia-900 focus:outline-none focus:border-cyan-500">
    </div>

    <div>
        <label class="block text-xs uppercase text-fuchsia-600 mb-1">
            Password {% if user %}<span class="text-neutral-400 lowercase">(leave empty to keep current)</span>{% endif %}
        </label>
        <input type="password" name="password" {% if not user %}required{% endif %}
               class="w-full border-2 border-fuchsia-300 bg-white p-2 text-sm text-fuchsia-900 focus:outline-none focus:border-cyan-500">
    </div>

    <div>
        <label class="block text-xs uppercase text-fuchsia-600 mb-1">Role</label>
        <select name="role"
                class="w-full border-2 border-fuchsia-300 bg-white p-2 text-sm text-fuchsia-900 focus:outline-none focus:border-cyan-500">
            <option value="employee" {% if user and user.role.value == "employee" %}selected{% endif %}>employee</option>
            <option value="admin" {% if user and user.role.value == "admin" %}selected{% endif %}>admin</option>
        </select>
    </div>

    <div>
        <label class="block text-xs uppercase text-fuchsia-600 mb-1">Branch</label>
        <select name="branch_id"
                class="w-full border-2 border-fuchsia-300 bg-white p-2 text-sm text-fuchsia-900 focus:outline-none focus:border-cyan-500">
            {% for branch in branches %}
            <option value="{{ branch.id }}" {% if user and user.branch_id == branch.id %}selected{% endif %}>{{ branch.label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="flex justify-end pt-2">
        <button type="submit"
                class="border-2 border-fuchsia-600 bg-fuchsia-400 px-6 py-2 text-sm font-bold uppercase text-white shadow-[4px_4px_0px_#a21caf] hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all">
            {% if user %}Save{% else %}Create{% endif %}
        </button>
    </div>
</form>
{% endblock %}
