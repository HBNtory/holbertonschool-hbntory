{% extends "base.html" %}

{% block title %}HBntory — Login{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10">
    <h1 class="text-2xl font-bold uppercase tracking-tight text-fuchsia-600 text-center mb-6">Backoffice login</h1>

    {% if error %}
    <div class="mb-5 border-l-4 border-red-500 bg-red-50 p-4">
        <p class="text-sm text-red-900">{{ error }}</p>
    </div>
    {% endif %}

    <form method="POST" action="/login"
          class="border-2 border-fuchsia-500 bg-white/90 p-6 shadow-[6px_6px_0px_#c026d3] space-y-4">
        <div>
            <label class="block text-xs uppercase text-fuchsia-600 mb-1">Email</label>
            <input type="email" name="email" required
                   class="w-full border-2 border-fuchsia-300 bg-white p-2 text-sm text-fuchsia-900 focus:outline-none focus:border-cyan-500">
        </div>
        <div>
            <label class="block text-xs uppercase text-fuchsia-600 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full border-2 border-fuchsia-300 bg-white p-2 text-sm text-fuchsia-900 focus:outline-none focus:border-cyan-500">
        </div>
        <div class="flex justify-end pt-2">
            <button type="submit"
                    class="border-2 border-fuchsia-600 bg-fuchsia-400 px-6 py-2 text-sm font-bold uppercase text-white shadow-[4px_4px_0px_#a21caf] hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all">
                Log in
            </button>
        </div>
    </form>
</div>
{% endblock %}
